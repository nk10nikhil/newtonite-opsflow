services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk
      POSTGRES_DB: opsdesk
    ports:
      - '5432:5432'
    volumes:
      - opsdesk-postgres:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsdesk -d opsdesk']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  opsdesk-postgres:
