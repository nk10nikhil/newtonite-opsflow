name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk
          POSTGRES_DB: opsdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsdesk -d opsdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opsdesk:opsdesk@localhost:5432/opsdesk_test?schema=public
      TEST_DATABASE_URL: postgresql://opsdesk:opsdesk@localhost:5432/opsdesk_test?schema=public
      SESSION_SECRET: ci-session-secret-change-this-before-use-123456
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
